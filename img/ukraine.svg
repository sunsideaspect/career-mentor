<?xml version="1.0" standalone="no"?>
<svg id="wrapper" viewBox="0 0 879 530.66" height="530.66" width="879" xmlns="http://www.w3.org/2000/svg" style="background-color: #020715;">
  <style>
    /* Стилі для областей */
    .oblast {
      fill: #1e1e26;
      stroke: #13254b;
      stroke-width: 0.8;
      transition: fill 0.3s;
    }
    .oblast:hover { fill: #2a2a35; }

    /* Стилі для міст */
    .city-dot {
      fill: #ffcc00;
      filter: url(#glow);
    }
    .city-label {
      fill: #ffffff;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>

  <defs>
    <!-- Ефект світіння для точок міст -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="map-group">
    <!-- Області (використовуємо ваш код, додаючи клас .oblast) -->
